<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Grúa armando el reporte" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .linea { stroke: #334155; stroke-width: 2; fill: none; stroke-linecap: round; }
    .fina { stroke: #64748b; stroke-width: 1.2; fill: none; }
    .carro { animation: carro 5.6s ease-in-out infinite; }
    .cable { transform-box: fill-box; transform-origin: top; animation: cable 5.6s ease-in-out infinite; }
    .carga { animation: carga 5.6s ease-in-out infinite; }
    .pluma { transform-origin: 62px 34px; animation: pluma 5.6s ease-in-out infinite; }
    .pila rect { animation: pila 5.6s ease-in-out infinite; }
    @keyframes carro { 0%, 12% { transform: translateX(0); } 45%, 62% { transform: translateX(62px); } 92%, 100% { transform: translateX(0); } }
    @keyframes cable { 0% { transform: scaleY(1.9); } 14% { transform: scaleY(1); } 45% { transform: scaleY(1); } 58% { transform: scaleY(2.6); } 70% { transform: scaleY(1); } 100% { transform: scaleY(1.9); } }
    @keyframes carga { 0% { transform: translateY(26px); } 14% { transform: translateY(0); } 45% { transform: translateY(0); } 58% { transform: translateY(46px); opacity: 1; } 62% { opacity: 0; } 88% { opacity: 0; transform: translateY(26px); } 100% { opacity: 1; transform: translateY(26px); } }
    @keyframes pluma { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-0.8deg); } }
    @keyframes pila { 0%, 56% { opacity: .35; } 62%, 100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .carro, .cable, .carga, .pluma, .pila rect { animation: none; } }
  </style>
  <line x1="18" y1="150" x2="222" y2="150" stroke="#cbd5e1" stroke-width="2"/>
  <!-- torre -->
  <g class="linea">
    <line x1="54" y1="150" x2="54" y2="38"/><line x1="70" y1="150" x2="70" y2="38"/>
  </g>
  <g class="fina">
    <path d="M54 150 L70 132 L54 114 L70 96 L54 78 L70 60 L54 42"/>
    <path d="M70 150 L54 132 L70 114 L54 96 L70 78 L54 60 L70 42"/>
  </g>
  <rect x="48" y="146" width="28" height="6" rx="1" fill="#334155"/>
  <!-- pluma y contrapluma -->
  <g class="pluma">
    <line x1="22" y1="34" x2="214" y2="34" class="linea"/>
    <line x1="62" y1="14" x2="22" y2="34" class="fina"/>
    <line x1="62" y1="14" x2="214" y2="34" class="fina"/>
    <line x1="62" y1="14" x2="62" y2="34" class="linea"/>
    <rect x="22" y="34" width="20" height="14" rx="2" fill="#94a3b8"/>
    <rect x="66" y="36" width="16" height="12" rx="2" fill="#0f766e"/>
    <rect x="69" y="39" width="6" height="5" rx="1" fill="#ccfbf1"/>
    <!-- carro, cable y carga -->
    <g class="carro">
      <rect x="112" y="31" width="14" height="6" rx="1.5" fill="#334155"/>
      <rect class="cable" x="118.4" y="37" width="1.2" height="22" fill="#475569"/>
      <g class="carga">
        <path d="M115 59 h10 l-2 4 h-6 z" fill="#334155"/>
        <rect x="106" y="63" width="28" height="18" rx="2" fill="#14b8a6"/>
        <rect x="106" y="63" width="28" height="5" rx="2" fill="#0f766e"/>
      </g>
    </g>
  </g>
  <!-- pila de bloques (el reporte que se arma) -->
  <g class="pila">
    <rect x="170" y="132" width="28" height="18" rx="2" fill="#99f6e4"/>
    <rect x="200" y="132" width="16" height="18" rx="2" fill="#5eead4"/>
    <rect x="178" y="114" width="28" height="18" rx="2" fill="#2dd4bf"/>
  </g>
</svg>
