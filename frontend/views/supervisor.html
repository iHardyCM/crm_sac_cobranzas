<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Supervisor</title>
    <link rel="stylesheet" href="../css/supervisor.css?v=20260521b">
</head>

<body onload="cargarSupervisor()">

    <aside class="app-sidebar">
        <button class="sidebar-logo" onclick="irInicio()" title="Inicio">
            <img src="logo_i_biznescob.png" alt="Biznescob">
        </button>
        <button class="sidebar-link" onclick="irInicio()">Inicio</button>
    </aside>

    <div class="header">
        <h2>Panel Supervisor</h2>
        <div class="header-user">
            <div id="usuario"></div>
            <button class="btn-salir" onclick="cerrarSesion()">Salir</button>
        </div>
    </div>

    <div class="acciones-top">
        <button class="btn-export-general"
            onclick="exportarCartera()">
            Exportar Compromisos
        </button>
    </div>

    <!-- KPIs -->
    <div class="cards">
        <div class="card">
            <h3 id="kpi_total">0</h3>
            <p>Total compromisos</p>
        </div>

        <div class="card">
            <h3 id="kpi_monto">0</h3>
            <p>Monto Generado</p>
        </div>

        <div class="card">
            <h3 id="kpi_recupero">0</h3>
            <p>Monto Recuperado</p>
        </div>

        <div class="card">
            <h3 id="kpi_eficacia">0%</h3>
            <p>Cumplimiento PDP</p>
        </div>

        <div class="card">
            <h3 id="kpi_caida">0%</h3>
            <p>Tasa caída</p>
        </div>
    </div>

    <!-- TABLA -->
    <table>
        <thead>
            <tr>
                <th onclick="ordenarPor('AGENTE')">Agente</th>
                <th onclick="ordenarPor('TOTAL')">Total Promesas (PDP)</th>
                <th onclick="ordenarPor('MONTO_TOTAL')">Total Monto (S/)</th>
                <th onclick="ordenarPor('HOY')">PDP Hoy</th>
                <th onclick="ordenarPor('CAIDA')">PDP Caída</th>
                <th onclick="ordenarPor('VIGENTE')">PDP Vigente</th>
                <th onclick="ordenarPor('CUMPLIDA')">PDP Cumplida</th>
                <th>Acción</th>
            </tr>
        </thead>

        <tbody id="tablaSupervisor"></tbody>
    </table>

</body>

<script src="../js/session.js"></script>
<script src="../js/supervisor.js?v=20260521"></script>
</html>
