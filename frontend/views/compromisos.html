<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Compromisos</title>
    <link rel="stylesheet" href="../css/compromisos.css">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/747/747376.png">
</head>
<body>

<div class="container">

    <!-- HEADER -->
    <div class="header">
        <div class="title">🏦 Sistema de Gestión de Compromisos</div>
        <div class="user"><span id="usuario"></span></div>
    </div>

    <!-- KPIs -->
    <div class="kpis">
        <div class="card hoy">
            <h3 id="kpi_hoy">0</h3>
            <p><b>Hoy</b></p>
            <small>Promesas con fecha para hoy</small>
        </div>
        <div class="card caida">
            <h3 id="kpi_caida">0</h3>
            <p><b>Caída</b></p>
            <small>Promesas que no llegaron a cumplirse en la fecha acordada.</small>
        </div>
        <div class="card vigente">
            <h3 id="kpi_vigente">0</h3>
            <p><b>Vigente</b></p>
            <small>Promesas de pago con fechas futuras.</small>
        </div>
        <div class="card cumplida">
            <h3 id="kpi_cumplida">0</h3>
            <p><b>Cumplida</b></p>
            <small>Promesas que se cumplieron.</small>
        </div>
    </div>

    <!-- CARD TABLA -->
    <div class="card-table">

        <div class="table-header">
            <h3 id="titulo_tabla"></h3>

            <div class="filtros">

                <input 
                    type="text" 
                    id="buscar" 
                    placeholder="🔍 Buscar DNI o teléfono"
                    onkeyup="aplicarFiltros()"
                >

                <select id="filtro_estado" onchange="aplicarFiltros()">
                    <option value="">Estado</option>
                    <option value="Hoy">Hoy</option>
                    <option value="Caída">Caída</option>
                    <option value="Vigente">Vigente</option>
                    <option value="Cumplida">Cumplida</option>
                </select>

                <select id="filtro_intentos" onchange="aplicarFiltros()">
                    <option value="">Intentos</option>
                    <option value="0">Sin gestión</option>
                    <option value="1-2">1 a 2</option>
                    <option value="3+">3 o más</option>
                </select>

                <input type="date" id="filtro_fecha" onchange="aplicarFiltros()">

            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th onclick="ordenarPor('cliente')">Cliente</th>
                    <th onclick="ordenarPor('dni')">DNI</th>
                    <th onclick="ordenarPor('telefono')">Teléfono</th>
                    <th onclick="ordenarPor('monto')">Monto</th>
                    <th onclick="ordenarPor('fecha')">Fecha</th>
                    <th onclick="ordenarPor('estado')">Estado</th>
                    <th onclick="ordenarPor('intentos_hoy')">Intentos Hoy</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="tabla"></tbody>
        </table>

        <!-- PAGINACIÓN (FUERA DE TABLE) -->
        <div class="paginacion">
            <button onclick="prev()">⬅</button>
            <span id="pagina_txt"></span>
            <button onclick="next()">➡</button>
        </div>

    </div>

</div>

<!-- MODAL -->
<div id="modal" class="modal">
    <div class="modal-content">
        <!-- <span onclick="cerrarModal()" class="close">×</span> -->
        <div id="detalle"></div>
    </div>
</div>

<script src="../js/compromisos.js"></script>

</body>
</html>
